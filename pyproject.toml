[project]
name = "httpxgen"
version = "0.1.0"
description = "Generate a typed async httpx client from an OpenAPI document."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
httpxgen = "httpxgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["httpxgen"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# preview/ is generated output, checked in to show what httpxgen emits. It is
# covered by the tests that generate it, not by this repository's style rules.
extend-exclude = ["preview"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "PTH",  # pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "--cov=httpxgen --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["httpxgen"]
