openapi: 3.1.0
info:
  title: Payments API
  description: >
    Single reference spec for testing httpxgen's client/model generation.
    Deliberately packs in the edge cases a generator needs to get right:
    discriminated unions (oneOf + discriminator), unions without a
    discriminator (anyOf), deeply nested object graphs, allOf inheritance,
    arrays of polymorphic items, nullable fields, const literals,
    free-form additionalProperties, bearer auth, and cursor pagination.

    Operations carry `payments` or `invoices` tags so httpxgen can generate
    a focused PaymentsClient and InvoicesClient from the same spec, e.g.:

      httpxgen specs/api.yml src/payments --package-name payments --tag payments
      httpxgen specs/api.yml src/invoices --package-name invoices --tag invoices --schema-tag payments
  version: "1.0.0"

servers:
  - url: https://payments.example.com/api

security:
  - bearerAuth: []

tags:
  - name: payments
    description: Payment methods, charges, and charge events.
  - name: invoices
    description: Invoices billed to a customer, optionally settled by a charge.

paths:
  /payment-methods:
    post:
      operationId: createPaymentMethod
      summary: Create a payment method (card or bank transfer)
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethod"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /payment-methods/lookup:
    post:
      operationId: lookupPaymentMethod
      summary: Find a payment method by one of two supported references
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodReference"
      responses:
        "200":
          description: Matching payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get a customer (deeply nested object graph)
      tags: [payments]
      security: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /customer-profiles:
    post:
      operationId: createCustomerProfile
      summary: Create a profile with directional input and output fields
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfile"
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"

  /customer-profiles/import:
    post:
      operationId: importCustomerProfile
      summary: Import profile fields from an HTML-style form
      tags: [payments]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [display_name, email]
              properties:
                display_name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: Imported

  /customer-profiles/avatar:
    post:
      operationId: uploadCustomerAvatar
      summary: Upload an avatar and its accessible description
      tags: [payments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, description]
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        "204":
          description: Uploaded

  /customer-profiles/archive:
    put:
      operationId: replaceCustomerArchive
      summary: Replace a profile archive with a raw binary payload
      tags: [payments]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Replaced

  /customer-profiles/convert:
    post:
      operationId: convertCustomerProfile
      summary: Convert a profile between JSON and plain-text representations
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfile"
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Converted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
            text/plain:
              schema:
                type: string

  /charges:
    post:
      operationId: createCharge
      summary: Create a charge
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChargeRequest"
      responses:
        "201":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "402":
          description: Payment declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeError"
    get:
      operationId: listCharges
      summary: List charges (cursor pagination)
      tags: [payments]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ChargeStatus"
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargePage"

  /charges/{chargeId}/events:
    get:
      operationId: listChargeEvents
      summary: List events for a charge (array of a discriminated union)
      tags: [payments]
      parameters:
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChargeEvent"

  /invoices:
    post:
      operationId: createInvoice
      summary: Create an invoice for a customer
      tags: [invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "422":
          description: Invoice could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listInvoices
      summary: List invoices (cursor pagination)
      tags: [invoices]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePage"

  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      summary: Get an invoice
      tags: [invoices]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invoices/{invoiceId}/send:
    post:
      operationId: sendInvoice
      summary: Send an invoice to its customer
      tags: [invoices]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invoice sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          description: Invoice cannot be sent from its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---- enums / const -------------------------------------------------
    ChargeStatus:
      type: string
      enum: [pending, succeeded, failed, refunded]

    # ---- discriminated union (oneOf + discriminator) -------------------
    CardPaymentMethod:
      type: object
      required: [type, card_number, exp_month, exp_year]
      properties:
        type:
          type: string
          const: card
        card_number:
          type: string
        exp_month:
          type: integer
          minimum: 1
          maximum: 12
        exp_year:
          type: integer
        billing_address:
          $ref: "#/components/schemas/Address"

    BankTransferPaymentMethod:
      type: object
      required: [type, iban, account_holder]
      properties:
        type:
          type: string
          const: bank_transfer
        iban:
          type: string
        account_holder:
          type: string

    PaymentMethod:
      oneOf:
        - $ref: "#/components/schemas/CardPaymentMethod"
        - $ref: "#/components/schemas/BankTransferPaymentMethod"
      discriminator:
        propertyName: type
        mapping:
          card: "#/components/schemas/CardPaymentMethod"
          bank_transfer: "#/components/schemas/BankTransferPaymentMethod"

    # ---- exact non-discriminated oneOf ----------------------------------
    PaymentMethodIdReference:
      type: object
      required: [payment_method_id]
      properties:
        payment_method_id:
          type: string

    PaymentMethodFingerprintReference:
      type: object
      required: [fingerprint]
      properties:
        fingerprint:
          type: string

    PaymentMethodReference:
      oneOf:
        - $ref: "#/components/schemas/PaymentMethodIdReference"
        - $ref: "#/components/schemas/PaymentMethodFingerprintReference"

    # ---- array of a *second*, independent discriminated union ----------
    ChargeCreatedEvent:
      type: object
      required: [type, occurred_at, charge]
      properties:
        type:
          type: string
          const: charge.created
        occurred_at:
          type: string
          format: date-time
        charge:
          $ref: "#/components/schemas/Charge"

    ChargeRefundedEvent:
      type: object
      required: [type, occurred_at, amount]
      properties:
        type:
          type: string
          const: charge.refunded
        occurred_at:
          type: string
          format: date-time
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer]
          nullable: true

    ChargeEvent:
      oneOf:
        - $ref: "#/components/schemas/ChargeCreatedEvent"
        - $ref: "#/components/schemas/ChargeRefundedEvent"
      discriminator:
        propertyName: type
        mapping:
          charge.created: "#/components/schemas/ChargeCreatedEvent"
          charge.refunded: "#/components/schemas/ChargeRefundedEvent"

    # ---- allOf inheritance ----------------------------------------------
    BaseEntity:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time

    Money:
      type: object
      required: [amount_cents, currency]
      properties:
        amount_cents:
          type: integer
        currency:
          type: string
          minLength: 3
          maxLength: 3

    Address:
      type: object
      required: [street, city, country]
      properties:
        street:
          type: string
        city:
          type: string
        postal_code:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2

    # ---- deeply nested object graph --------------------------------------
    Customer:
      allOf:
        - $ref: "#/components/schemas/BaseEntity"
        - type: object
          required: [email, billing_profile]
          properties:
            email:
              type: string
              format: email
            billing_profile:
              type: object
              required: [address]
              properties:
                address:
                  $ref: "#/components/schemas/Address"
                default_payment_method:
                  anyOf:
                    - $ref: "#/components/schemas/PaymentMethod"
                    - type: "null"
                saved_payment_methods:
                  type: array
                  items:
                    $ref: "#/components/schemas/PaymentMethod"
            metadata:
              type: object
              additionalProperties:
                type: string

    # ---- directional request/response schema ----------------------------
    CustomerProfile:
      type: object
      additionalProperties: false
      required: [id, display_name, invitation_code]
      properties:
        id:
          type: string
          readOnly: true
        display_name:
          type: string
        invitation_code:
          type: string
          writeOnly: true

    CreateChargeRequest:
      type: object
      required: [amount, payment_method]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        customer_id:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties:
            type: string
        idempotency_key:
          type: string
          format: uuid

    Charge:
      allOf:
        - $ref: "#/components/schemas/BaseEntity"
        - type: object
          required: [amount, status, payment_method]
          properties:
            amount:
              $ref: "#/components/schemas/Money"
            status:
              $ref: "#/components/schemas/ChargeStatus"
            payment_method:
              $ref: "#/components/schemas/PaymentMethod"
            refunded_amount:
              $ref: "#/components/schemas/Money"
              nullable: true
            metadata:
              type: object
              additionalProperties:
                type: string

    ChargePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Charge"
        next_cursor:
          type: string
          nullable: true

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ChargeError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [card_declined, insufficient_funds, invalid_iban]
        message:
          type: string
        charge:
          anyOf:
            - $ref: "#/components/schemas/Charge"
            - type: "null"

    # ---- invoices ---------------------------------------------------------
    InvoiceStatus:
      type: string
      enum: [draft, sent, paid, void]

    InvoiceLineItem:
      type: object
      required: [description, amount]
      properties:
        description:
          type: string
        quantity:
          type: integer
          default: 1
          minimum: 1
        amount:
          $ref: "#/components/schemas/Money"

    Invoice:
      allOf:
        - $ref: "#/components/schemas/BaseEntity"
        - type: object
          required: [customer_id, status, line_items, total]
          properties:
            customer_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/InvoiceStatus"
            line_items:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceLineItem"
            total:
              $ref: "#/components/schemas/Money"
            charge_id:
              type: string
              nullable: true
            metadata:
              type: object
              additionalProperties:
                type: string

    CreateInvoiceRequest:
      type: object
      required: [customer_id, line_items]
      properties:
        customer_id:
          type: string
          format: uuid
        line_items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
        metadata:
          type: object
          additionalProperties:
            type: string

    InvoicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        next_cursor:
          type: string
          nullable: true
